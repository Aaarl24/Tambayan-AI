<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tambay-AI — Know before you walk</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#15100D" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="vendor/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="map" role="application" aria-label="Cafe availability map"></div>

<div id="connBanner" role="status"></div>
<div id="demoBadge">Demo data</div>

<div id="topbar">
  <div id="toprow">
    <div id="brand"><span id="brandName">Tambay-AI</span><span id="tagline"></span></div>
    <div id="spacer"></div>
    <button class="pillbtn" id="langBtn" aria-label="switch language">FIL</button>
    <button class="pillbtn" id="locBtn"></button>
    <button class="pillbtn" id="findBtn"></button>
  </div>
  <div id="chips" role="group" aria-label="filters"></div>
</div>

<div id="empty"><h2 id="emptyTitle"></h2><p id="emptyBody"></p></div>

<div id="sheet">
  <div id="grab" role="slider" tabindex="0" aria-label="bottom sheet" aria-orientation="vertical"></div>
  <div id="sheetBody"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/leaflet.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
